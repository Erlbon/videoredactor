name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The external-tools tests expect ffmpeg on PATH (and MKVToolNix
      # absent, which it is on the hosted runner).
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

  # Linux-only failures used to surface only in the release workflow's
  # `linux` job; this runs the same suite on every push. The apt packages
  # are the ones redactor-build-tools' Dockerfile installs for that job
  # (headless Qt libraries, plus ffmpeg and MKVToolNix for the tests that
  # run the real tools). A separate job rather than a matrix entry so the
  # Windows job above stays exactly as it was; the two never cancel each other.
  pytest-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libgl1 libegl1 libdbus-1-3 fontconfig \
            ffmpeg mkvtoolnix

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
