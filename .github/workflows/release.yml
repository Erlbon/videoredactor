name: Release

# The Linux download. The Windows files (videoredactor.exe, videoredactor-setup.exe) and update-manifest.json are built and
# published on the owner's PC by redactor_common's release tool (pyproject.toml; redactor_common
# docs/update-framework.md). It creates the release as a pre-release, which counts as "published": this workflow then
# builds that tag in the same Docker toolchain as a local Linux build (github.com/Erlbon/redactor-build-tools: Ubuntu
# 22.04, Python 3.12, tests run inside it first) and adds the tarball to the release. The Linux build cannot replace
# itself (it says so and opens the release page), so the manifest does not list it.
#
# This workflow never builds or uploads the Windows exe: an upload with --clobber would replace the file the manifest
# pins, and every copy's update would fail its checksum (as Dossier's build.yml, 2026-11-23).
#
# By hand, for a release already out:  gh workflow run release.yml -f tag=v2026-11-26-02

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the Linux tarball for and add it to, e.g. v2026-11-26-02"
        required: true

permissions:
  contents: write     # gh release upload

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/checkout@v7
        with:
          repository: Erlbon/redactor-build-tools
          path: build-tools

      - name: Build and test in the Linux toolchain
        run: bash build-tools/linux-build/build.sh . videoredactor.spec --test

      - name: Package
        run: bash build-tools/linux-build/package.sh . videoredactor "The Ʌideo Redactor"

      - name: Upload to the release
        run: gh release upload "$TAG" dist-linux/videoredactor-linux-x86_64.tar.gz --clobber
